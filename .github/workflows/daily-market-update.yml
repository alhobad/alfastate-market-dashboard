name: Daily Market Update

on:
  schedule:
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Show changes without committing or creating PR'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run dashboard update script
        run: node scripts/update-dashboard.js
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry-run == 'true' && 'true' || '' }}

      - name: Check for changes
        id: git-diff
        run: |
          if git diff --quiet -- index.html scripts/state.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        id: pr
        if: steps.git-diff.outputs.changed == 'true' && github.event.inputs.dry-run != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: daily market update for $(date +'%Y-%m-%d')"
          title: "Daily Market Update — $(date +'%Y-%m-%d')"
          body: |
            Automated daily market data update generated by GitHub Actions.

            **Changes:**
            - Updated rate data from Bank of Canada, Freddie Mac PMMS, and FRED
            - Updated narrative copy based on current market conditions
            - Updated dates and source references

            Please review and merge if the data looks correct.
          branch: update/dashboard-${{ github.run_id }}
          base: main
          labels: automated-update

      - name: Send email notification
        if: steps.pr.outputs.pull-request-url != ''
        run: node scripts/send-email.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
