name: Daily Market Update

on:
  schedule:
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Show changes without committing or pushing'
        type: boolean
        default: false
      send-test-email:
        description: 'Send a test email without updating the dashboard'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Send test email
        if: github.event.inputs.send-test-email == 'true'
        run: node scripts/send-email.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_SUBJECT: "TEST — Alfastate dashboard notification"
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}

      - name: Install dependencies
        if: github.event.inputs.send-test-email != 'true'
        run: npm install

      - name: Generate date string
        id: date
        if: github.event.inputs.send-test-email != 'true'
        run: echo "stamp=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Run dashboard update script
        if: github.event.inputs.send-test-email != 'true'
        run: node scripts/update-dashboard.js
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry-run == 'true' && 'true' || '' }}

      - name: Check for changes
        if: github.event.inputs.send-test-email != 'true'
        id: git-diff
        run: |
          if git diff --quiet -- index.html scripts/state.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push to main
        if: steps.git-diff.outputs.changed == 'true' && github.event.inputs.dry-run != 'true' && github.event.inputs.send-test-email != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/state.json
          git commit -m "chore: daily market update ${{ steps.date.outputs.stamp }}"
          git push

      - name: Send email notification
        if: steps.git-diff.outputs.changed == 'true' && github.event.inputs.dry-run != 'true' && github.event.inputs.send-test-email != 'true'
        run: node scripts/send-email.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          EMAIL_SUBJECT: "Alfastate dashboard published — ${{ steps.date.outputs.stamp }}"
